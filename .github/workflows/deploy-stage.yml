name: Deploy to Stage

on:
  push:
    branches: [ stage ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SLS_DISABLE_DASHBOARD: "true"
      SLS_TELEMETRY_DISABLED: "true"
      SLS_ORG: ""
      SLS_APP: ""
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Install Serverless Framework
      run: npm install -g serverless

    - name: Configure Serverless Framework
      run: |
        mkdir -p ~/.serverless
        echo '{"frameworkVersion": "3", "telemetryDisabled": true, "dashboard": {"enabled": false}}' > ~/.serverless/config.json

    - name: Deploy to Stage
      run: serverless deploy --stage stage --verbose
      env:
        ADMIN_USER_POOL_ID: ${{ secrets.ADMIN_USER_POOL_ID_STAGE }}
        ADMIN_CLIENT_ID: ${{ secrets.ADMIN_CLIENT_ID_STAGE }}
        ADMIN_DEFAULT_USERNAME: ${{ secrets.ADMIN_DEFAULT_USERNAME }}
        ADMIN_DEFAULT_PASSWORD: ${{ secrets.ADMIN_DEFAULT_PASSWORD }}
        CONSUMER_USER_POOL_ID: ${{ secrets.CONSUMER_USER_POOL_ID_STAGE }}
        CONSUMER_CLIENT_ID: ${{ secrets.CONSUMER_CLIENT_ID_STAGE }}
        CONSUMER_DEFAULT_USERNAME: ${{ secrets.CONSUMER_DEFAULT_USERNAME }}
        CONSUMER_DEFAULT_PASSWORD: ${{ secrets.CONSUMER_DEFAULT_PASSWORD }}
        API_BASE_URL: ${{ vars.API_BASE_URL_STAGE }} 