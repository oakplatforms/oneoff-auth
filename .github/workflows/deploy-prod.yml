name: Deploy to Production

on:
  push:
    branches: [ prod ]

# Required for OIDC token generation
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SLS_DISABLE_DASHBOARD: "true"
      SLS_TELEMETRY_DISABLED: "true"
      SLS_ORG: ""
      SLS_APP: ""
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # OIDC-based AWS authentication (no access keys needed)
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
        aws-region: us-east-1

    - name: Install Serverless Framework
      run: npm install -g serverless

    - name: Configure Serverless Framework
      run: |
        mkdir -p ~/.serverless
        echo '{"frameworkVersion": "3", "telemetryDisabled": true, "dashboard": {"enabled": false}}' > ~/.serverless/config.json

    - name: Deploy to Production
      run: serverless deploy --stage prod --verbose
      env:
        ADMIN_USER_POOL_ID: ${{ vars.ADMIN_USER_POOL_ID_PROD }}
        ADMIN_CLIENT_ID: ${{ vars.ADMIN_CLIENT_ID_PROD }}
        CONSUMER_USER_POOL_ID: ${{ vars.CONSUMER_USER_POOL_ID_PROD }}
        CONSUMER_CLIENT_ID: ${{ vars.CONSUMER_CLIENT_ID_PROD }}
        API_BASE_URL: ${{ vars.API_BASE_URL_PROD }}