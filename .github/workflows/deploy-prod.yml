name: Deploy to Production

on:
  push:
    branches: [ prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SLS_DISABLE_DASHBOARD: "true"
      SLS_TELEMETRY_DISABLED: "true"
      SLS_ORG: ""
      SLS_APP: ""
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Install Serverless Framework
      run: npm install -g serverless

    - name: Configure Serverless Framework
      run: |
        mkdir -p ~/.serverless
        echo '{"frameworkVersion": "3", "telemetryDisabled": true, "dashboard": {"enabled": false}}' > ~/.serverless/config.json

    - name: Deploy to Production
      run: serverless deploy --stage prod --verbose
      env:
        USER_POOL_ID: ${{ secrets.USER_POOL_ID_PROD }}
        APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID_PROD }}
        DEFAULT_USERNAME: ${{ secrets.DEFAULT_USERNAME_PROD }}
        DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD_PROD }}
        API_BASE_URL: ${{ vars.API_BASE_URL_PROD }} 