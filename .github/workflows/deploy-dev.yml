name: Deploy to Dev

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SLS_DISABLE_DASHBOARD: "true"
      SLS_TELEMETRY_DISABLED: "true"
      SLS_ORG: ""
      SLS_APP: ""
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Serverless Framework
      run: npm install -g serverless
    - name: Configure Serverless Framework
      run: |
        mkdir -p ~/.serverless
        echo '{"frameworkVersion": "3", "telemetryDisabled": true, "dashboard": {"enabled": false}}' > ~/.serverless/config.json
    - name: Deploy to Dev
      run: serverless deploy --stage dev --verbose
      env:
        ADMIN_USER_POOL_ID: ${{ secrets.ADMIN_USER_POOL_ID_DEV }}
        CLIENT_APPS_USER_POOL_ID: ${{ secrets.CLIENT_APPS_USER_POOL_ID_DEV }}
        TEMP_JWT_SECRET: ${{ secrets.TEMP_JWT_SECRET_DEV }} 