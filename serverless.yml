service: oneoff-auth

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  httpApi:
    payload: '2.0'

  environment:
    NODE_ENV: ${sls:stage}
    STAGE: ${sls:stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:AdminInitiateAuth
          Resource: 
            - arn:aws:cognito-idp:us-east-1:${aws:accountId}:userpool/${env:CONSUMER_USER_POOL_ID}

functions:
  oneoff-consumer-post-confirmation:
    name: oneoff-consumer-post-confirmation-${sls:stage}
    handler: lambdas/consumerPostConfirmationHandler.handler
    environment:
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
      CONSUMER_CLIENT_ID: ${env:CONSUMER_CLIENT_ID}
      CONSUMER_DEFAULT_USERNAME: ${env:CONSUMER_DEFAULT_USERNAME}
      CONSUMER_DEFAULT_PASSWORD: ${env:CONSUMER_DEFAULT_PASSWORD}
      API_BASE_URL: ${env:API_BASE_URL}
  
  oneoff-change-password:
    name: oneoff-change-password-${sls:stage}
    handler: lambdas/changePasswordHandler.handler
    environment:
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
      CONSUMER_CLIENT_ID: ${env:CONSUMER_CLIENT_ID}
      API_BASE_URL: ${env:API_BASE_URL}
      
  oneoff-forgot-password:
    name: oneoff-forgot-password-${sls:stage}
    handler: lambdas/forgotPasswordHandler.handler
    environment:
      CONSUMER_USER_POOL_ID: ${env:CONSUMER_USER_POOL_ID}
      CONSUMER_CLIENT_ID: ${env:CONSUMER_CLIENT_ID}
      API_BASE_URL: ${env:API_BASE_URL}

custom:
  dotenv:
    path: .env.${opt:stage, 'dev'}
    logging: false

  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    concurrency: 10

package:
  individually: true 
